name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Install archive tools
        run: |
          if ! command -v ar > /dev/null || ! command -v xz > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils xz-utils
          fi

      - name: Cache bundled binaries
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/toolchain
          key: bundled-${{ hashFiles('scripts/fetch-runtime.sh', 'scripts/fetch-toolchain.sh', 'scripts/busybox-applets.txt') }}

      - name: Fetch opencode runtime
        run: bash ./scripts/fetch-runtime.sh

      - name: Fetch toolchain
        run: bash ./scripts/fetch-toolchain.sh

      - name: Build and verify
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kodepocket-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
