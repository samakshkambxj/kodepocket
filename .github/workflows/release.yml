name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KODEPOCKET_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Install archive tools
        run: |
          if ! command -v ar > /dev/null || ! command -v xz > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils xz-utils
          fi

      - name: Cache bundled binaries
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/toolchain
          key: bundled-${{ hashFiles('scripts/fetch-runtime.sh', 'scripts/fetch-toolchain.sh', 'scripts/busybox-applets.txt') }}

      - name: Fetch opencode runtime
        run: bash ./scripts/fetch-runtime.sh

      - name: Fetch toolchain
        run: bash ./scripts/fetch-toolchain.sh

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kodepocket.p12"
          echo "KODEPOCKET_KEYSTORE=$RUNNER_TEMP/kodepocket.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KODEPOCKET_KEYSTORE_PASSWORD: ${{ secrets.KODEPOCKET_KEYSTORE_PASSWORD }}
          KODEPOCKET_KEY_ALIAS: ${{ secrets.KODEPOCKET_KEY_ALIAS }}
          KODEPOCKET_KEY_PASSWORD: ${{ secrets.KODEPOCKET_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/kodepocket-${VERSION}.apk"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION}.txt"
          fi
          cd dist && sha256sum ./* > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
